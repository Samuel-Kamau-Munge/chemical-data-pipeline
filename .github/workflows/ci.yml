name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --editable .
      - run: python -m compileall -q chemical_pipeline dags tests
      - run: python -m unittest discover -s tests -v

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install dbt-core==1.7.10 dbt-postgres==1.7.10 protobuf==4.25.8
      - name: Parse dbt project
        env:
          DBT_DB_PASSWORD: ci-placeholder
          DBT_DATABASE: chemical_lab
        run: dbt parse --project-dir dbt --profiles-dir dbt

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chemical_lab
          POSTGRES_USER: chemical_admin
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chemical_admin -d chemical_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --editable '.[streaming]'
      - name: Apply migrations and reconcile persisted rows
        env:
          PIPELINE_TEST_ADMIN_DB_URL: postgresql://chemical_admin:ci-only-password@localhost:5432/chemical_lab
        run: python -m unittest discover -s tests -p 'test_migrations_integration.py' -v
