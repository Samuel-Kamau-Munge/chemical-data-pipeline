name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --editable .
      - run: python -m compileall -q chemical_pipeline dags tests
      - run: python -m unittest discover -s tests -v

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install dbt-core==1.9.0 dbt-postgres==1.9.0
      - name: Parse dbt project
        env:
          DBT_DB_PASSWORD: ci-placeholder
          DBT_DATABASE: chemical_lab
        run: dbt parse --project-dir dbt --profiles-dir dbt
