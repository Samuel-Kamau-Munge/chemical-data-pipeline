chemical_lab:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'postgres') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_DB_USER', 'dbt_transform') }}"
      password: "{{ env_var('DBT_DB_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'chemical_lab') }}"
      schema: analytics
      threads: 2
      connect_timeout: 5
